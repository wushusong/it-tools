    const ZODIAC_ANIMALS = ['鼠','牛','虎','兔','龙','蛇','马','羊','猴','鸡','狗','猪'];

    function getConstellation(month, day) {
        for (const c of CONSTELLATIONS) {
            const m = month, d = day;
            if ((m > c.start[0] || (m === c.start[0] && d >= c.start[1])) &&
                (m < c.end[0] || (m === c.end[0] && d <= c.end[1]))) {
                return c.name;
            }
        }
        return '摩羯座';
    }

    function getZodiac(year) {
        return ZODIAC_ANIMALS[(year - 4) % 12];
    }

    function calcAge(birthDate) {
        const now = new Date();
        let age = now.getFullYear() - birthDate.getFullYear();
        const mDiff = now.getMonth() - birthDate.getMonth();
        if (mDiff < 0 || (mDiff === 0 && now.getDate() < birthDate.getDate())) age--;
        return age;
    }

    function calcCheckDigit(first17) {
        let sum = 0;
        for (let i = 0; i < 17; i++) sum += parseInt(first17[i]) * WEIGHTS[i];
        return CHECK_CODES[sum % 11];
    }

        const city = CITY[parseInt(code6.substring(0,4))];

        if (city && city !== prov) region = prov + ' ' + city;
        if (parseInt(district) > 0) region += ' (' + code6.substring(0,6) + ')';

        const year = parseInt(birth.substring(0,4));
        const month = parseInt(birth.substring(4,6));
        const day = parseInt(birth.substring(6,8));
        const birthDate = new Date(year, month - 1, day);
        const dateValid = birthDate.getFullYear() === year && birthDate.getMonth() === month - 1 && birthDate.getDate() === day;

        const orderNum = parseInt(order);
        const gender = orderNum % 2 === 1 ? '男' : '女';
        const genderIcon = gender === '男' ? '♂' : '♀';

        const regionName = getRegion(region);
        const birthStr = dateValid ? `${year} 年 ${month} 月 ${day} 日` : `${birth.substring(0,4)}-${birth.substring(4,6)}-${birth.substring(6,8)}（日期无效）`;
        const age = dateValid ? calcAge(birthDate) : '—';
        const constellation = dateValid ? getConstellation(month, day) : '—';
        const zodiac = dateValid ? getZodiac(year) : '—';

        // 年龄补充
        let ageText = age;
        if (typeof age === 'number') {
            if (age < 0) ageText = '未出生（出生日期在未来）';
            else ageText = age + ' 岁';
        }

        let infoHtml = '';
        infoHtml += `<div class="info-item"><span class="info-label">🗺️ 发证地区</span><span class="info-value">${regionName}</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">🎂 出生日期</span><span class="info-value">${birthStr}</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">📅 年龄</span><span class="info-value">${ageText}</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">${genderIcon} 性别</span><span class="info-value">${gender}</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">⭐ 星座</span><span class="info-value">${constellation}</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">🐾 生肖</span><span class="info-value">${zodiac !== '—' ? zodiac + '年' : '—'}</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">🔢 顺序码</span><span class="info-value">${order} (${orderNum % 2 === 1 ? '奇数→男' : '偶数→女'})</span></div>`;
        infoHtml += `<div class="info-item"><span class="info-label">✅ 校验码</span><span class="info-value">${check} ${checkValid ? '(正确)' : '(应为 ' + expectedCheck + ')'}</span></div>`;

        $('infoGrid').innerHTML = infoHtml;
    };

    // 回车触发
    $('idInput').addEventListener('keypress', e => { if (e.key === 'Enter') { e.preventDefault(); analyze(); } });
    // 实时清除错误样式
    $('idInput').addEventListener('input', () => { $('idInput').className = 'input-field'; });
})();
</script>
</body>
</html>
