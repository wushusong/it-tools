<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>SSE 流式数据可视化 | 开发工具箱</title>
    <link rel="icon" href="../wss.png" type="image/x-icon">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            padding: 2rem 1.5rem; min-height: 100vh; color: #e2e8f0;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .nav-bar { margin-bottom: 1.5rem; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.08); backdrop-filter: blur(8px);
            padding: 0.5rem 1.2rem; border-radius: 60px; text-decoration: none;
            color: #94a3b8; font-weight: 500; font-size: 0.9rem; transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-link:hover { background: rgba(255,255,255,0.15); color: #e2e8f0; transform: translateX(-3px); }
        .page-header { text-align: center; margin-bottom: 1.8rem; }
        .page-header h1 {
            font-size: 2.2rem; font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .page-header p { color: #64748b; margin-top: 0.3rem; }

        .card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(8px);
            border-radius: 1.5rem; padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.08); margin-bottom: 1.2rem;
        }
        .card-title {
            font-size: 1.05rem; font-weight: 600; color: #38bdf8;
            margin-bottom: 1rem; padding-bottom: 0.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        /* 连接区 */
        .connect-row {
            display: flex; gap: 0.6rem; align-items: stretch; flex-wrap: wrap;
        }
        .url-input {
            flex: 1; min-width: 250px; padding: 0.7rem 1rem;
            background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 0.8rem; color: #e2e8f0; font-size: 0.92rem;
            font-family: 'Consolas', 'Monaco', monospace; transition: 0.2s;
        }
        .url-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
        .url-input::placeholder { color: #475569; }

        .btn {
            border: none; border-radius: 0.8rem; padding: 0.7rem 1.4rem;
            font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.2s;
            font-family: inherit; white-space: nowrap;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-connect { background: linear-gradient(135deg, #22c55e, #16a34a); color: white; }
        .btn-connect:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(34,197,94,0.4); }
        .btn-disconnect { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .btn-disconnect:hover:not(:disabled) { box-shadow: 0 4px 12px rgba(239,68,68,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover:not(:disabled) { background: rgba(255,255,255,0.12); color: #e2e8f0; }

        /* 状态栏 */
        .status-bar {
            display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center;
            margin-top: 1rem; padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .status-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            display: inline-block; flex-shrink: 0;
        }
        .dot-disconnected { background: #64748b; }
        .dot-connecting { background: #f59e0b; animation: pulse 1s infinite; }
        .dot-connected { background: #22c55e; animation: pulse 2s infinite; }
        .dot-error { background: #ef4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .status-label { color: #64748b; }
        .status-value { color: #cbd5e1; font-family: 'Consolas', monospace; }
        .stat-num { color: #38bdf8; font-weight: 700; font-family: 'Consolas', monospace; }

        /* 事件流 */
        .stream-area {
            max-height: 520px; overflow-y: auto; overflow-x: hidden;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.82rem; line-height: 1.6;
            background: rgba(0,0,0,0.3); border-radius: 1rem;
            padding: 0.8rem; position: relative;
        }
        .stream-area::-webkit-scrollbar { width: 6px; }
        .stream-area::-webkit-scrollbar-track { background: transparent; }
        .stream-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

        .event-block {
            padding: 0.6rem 0.8rem; margin-bottom: 0.4rem;
            border-radius: 0.6rem; border-left: 3px solid transparent;
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .event-block.type-message { border-left-color: #38bdf8; background: rgba(56,189,248,0.05); }
        .event-block.type-open { border-left-color: #22c55e; background: rgba(34,197,94,0.08); }
        .event-block.type-error { border-left-color: #ef4444; background: rgba(239,68,68,0.08); }
        .event-block.type-close { border-left-color: #f59e0b; background: rgba(245,158,11,0.08); }
        .event-block.type-custom { border-left-color: #a78bfa; background: rgba(167,139,250,0.05); }

        .event-header {
            display: flex; gap: 0.8rem; align-items: center;
            margin-bottom: 0.3rem; flex-wrap: wrap;
        }
        .event-type {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            padding: 0.15rem 0.5rem; border-radius: 0.3rem;
        }
        .badge-message { background: rgba(56,189,248,0.2); color: #38bdf8; }
        .badge-open { background: rgba(34,197,94,0.2); color: #22c55e; }
        .badge-error { background: rgba(239,68,68,0.2); color: #ef4444; }
        .badge-close { background: rgba(245,158,11,0.2); color: #f59e0b; }
        .badge-custom { background: rgba(167,139,250,0.2); color: #a78bfa; }

        .event-time { color: #475569; font-size: 0.72rem; }
        .event-id { color: #64748b; font-size: 0.72rem; }
        .event-data {
            color: #cbd5e1; white-space: pre-wrap; word-break: break-all;
            padding: 0.3rem 0;
        }
        .json-key { color: #7dd3fc; }
        .json-string { color: #86efac; }
        .json-number { color: #fbbf24; }
        .json-bool { color: #c084fc; }
        .json-null { color: #64748b; }

        .empty-stream {
            text-align: center; color: #475569; padding: 3rem 1rem;
            font-size: 0.9rem;
        }
        .empty-stream .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

        /* 选项行 */
        .options-row {
            display: flex; gap: 1rem; flex-wrap: wrap; align-items: center;
            margin-top: 0.8rem;
        }
        .opt-label {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.82rem; color: #94a3b8; cursor: pointer;
        }
        .opt-label input[type="checkbox"] {
            accent-color: #38bdf8;
        }

        .toolbar {
            display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
            margin-bottom: 0.8rem;
        }

        footer { margin-top: 2.5rem; text-align: center; font-size: 0.75rem; color: #475569; }

        @media (max-width: 640px) {
            body { padding: 1rem; }
            .page-header h1 { font-size: 1.7rem; }
            .connect-row { flex-direction: column; }
            .status-bar { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-bar">
        <a href="../index.html" class="back-link">&#8592; 返回工具箱首页</a>
    </div>
    <div class="page-header">
        <h1>&#128225; SSE 流式数据可视化</h1>
        <p>Server-Sent Events · 实时数据流 · JSON 格式化 · 事件分析</p>
    </div>

    <div class="card">
        <div class="card-title">&#128279; 连接配置</div>
        <div class="connect-row">
            <input type="text" class="url-input" id="sseUrl"
                   placeholder="https://example.com/api/stream"
                   value="">
            <button class="btn btn-connect" id="connectBtn" onclick="toggleConnection()">&#9654; 连接</button>
        </div>
        <div class="options-row">
            <label class="opt-label"><input type="checkbox" id="optAutoScroll" checked> 自动滚动</label>
            <label class="opt-label"><input type="checkbox" id="optFormatJson" checked> JSON 格式化</label>
            <label class="opt-label"><input type="checkbox" id="optShowTimestamp" checked> 显示时间戳</label>
            <label class="opt-label"><input type="checkbox" id="optMaxEvents" checked> 限制 500 条</label>
        </div>
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot dot-disconnected" id="statusDot"></span>
                <span class="status-label">状态：</span>
                <span class="status-value" id="statusText">未连接</span>
            </div>
            <div class="status-item">
                <span class="status-label">事件数：</span>
                <span class="stat-num" id="eventCount">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">数据量：</span>
                <span class="stat-num" id="dataSize">0 B</span>
            </div>
            <div class="status-item">
                <span class="status-label">持续时间：</span>
                <span class="stat-num" id="duration">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">速率：</span>
                <span class="stat-num" id="rate">0/s</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">&#128230; 事件流</div>
        <div class="toolbar">
            <button class="btn btn-secondary btn-sm" onclick="clearStream()">&#128465; 清空</button>
            <button class="btn btn-secondary btn-sm" onclick="exportEvents()">&#128229; 导出 JSON</button>
            <button class="btn btn-secondary btn-sm" onclick="exportRaw()">&#128196; 导出原始</button>
            <button class="btn btn-secondary btn-sm" onclick="copyLast()">&#128203; 复制最新</button>
        </div>
        <div class="stream-area" id="streamArea">
            <div class="empty-stream">
                <div class="icon">&#128225;</div>
                <div>输入 SSE 地址并点击「连接」开始监听</div>
                <div style="font-size:0.78rem;margin-top:0.5rem;color:#334155;">
                    支持标准 SSE 协议 · 捕获所有自定义事件类型（含 event: 字段） · JSON 自动美化
                </div>
            </div>
        </div>
    </div>

    <footer>&#128295; 纯前端 · Fetch + ReadableStream 全量解析 SSE 协议 · 捕获所有自定义事件类型</footer>
</div>

<script>
(function() {
    'use strict';
    const $ = id => document.getElementById(id);

    let abortController = null;
    let events = [];
    let totalBytes = 0;
    let startTime = null;
    let durationTimer = null;

    // ========== 状态管理 ==========
    function setStatus(state, text) {
        const dot = $('statusDot');
        dot.className = 'status-dot dot-' + state;
        $('statusText').textContent = text;
    }

    function updateStats() {
        $('eventCount').textContent = events.length;
        $('dataSize').textContent = formatBytes(totalBytes);
        if (startTime) {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            $('duration').textContent = formatDuration(elapsed);
            const rate = elapsed > 0 ? (events.length / elapsed).toFixed(1) : '0';
            $('rate').textContent = rate + '/s';
        }
    }

    function formatBytes(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(2) + ' MB';
    }

    function formatDuration(s) {
        if (s < 60) return s + 's';
        if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
        return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    }

    function timeStr() {
        const d = new Date();
        return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}.${String(d.getMilliseconds()).padStart(3,'0')}`;
    }

    // ========== JSON 语法高亮 ==========
    function highlightJSON(obj, depth) {
        if (depth === undefined) depth = 0;
        if (depth > 6) return escapeHtml(JSON.stringify(obj));
        if (obj === null) return '<span class="json-null">null</span>';
        if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
        if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
        if (typeof obj === 'string') return `<span class="json-string">"${escapeHtml(obj)}"</span>`;
        const indent = '  '.repeat(depth);
        const inner = '  '.repeat(depth + 1);
        if (Array.isArray(obj)) {
            if (obj.length === 0) return '[]';
            const items = obj.map(v => inner + highlightJSON(v, depth + 1));
            return '[\n' + items.join(',\n') + '\n' + indent + ']';
        }
        const keys = Object.keys(obj);
        if (keys.length === 0) return '{}';
        const items = keys.map(k =>
            inner + `<span class="json-key">"${escapeHtml(k)}"</span>: ` + highlightJSON(obj[k], depth + 1)
        );
        return '{\n' + items.join(',\n') + '\n' + indent + '}';
    }

    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatData(data) {
        if (!$('optFormatJson').checked) return escapeHtml(data);
        try {
            const obj = JSON.parse(data);
            return highlightJSON(obj);
        } catch {
            return escapeHtml(data);
        }
    }

    // ========== 事件渲染 ==========
    function addEventBlock(type, data, eventId) {
        const area = $('streamArea');
        // 移除空状态
        const empty = area.querySelector('.empty-stream');
        if (empty) empty.remove();

        const block = document.createElement('div');
        const badgeClass = { open: 'badge-open', message: 'badge-message', error: 'badge-error', close: 'badge-close' }[type] || 'badge-custom';
        const blockClass = { open: 'type-open', message: 'type-message', error: 'type-error', close: 'type-close' }[type] || 'type-custom';
        block.className = `event-block ${blockClass}`;

        let headerHtml = '<div class="event-header">';
        headerHtml += `<span class="event-type ${badgeClass}">${type}</span>`;
        if ($('optShowTimestamp').checked) headerHtml += `<span class="event-time">${timeStr()}</span>`;
        if (eventId) headerHtml += `<span class="event-id">id: ${escapeHtml(eventId)}</span>`;
        headerHtml += '</div>';

        let dataHtml = '';
        if (data) dataHtml = `<div class="event-data">${formatData(data)}</div>`;

        block.innerHTML = headerHtml + dataHtml;
        area.appendChild(block);

        // 限制事件数
        if ($('optMaxEvents').checked) {
            const blocks = area.querySelectorAll('.event-block');
            while (blocks.length > 500) {
                blocks[0].remove();
            }
        }

        // 自动滚动
        if ($('optAutoScroll').checked) {
            area.scrollTop = area.scrollHeight;
        }
    }

    function recordEvent(type, data, eventId) {
        const evt = { type, data: data || '', id: eventId || null, time: new Date().toISOString() };
        events.push(evt);
        totalBytes += (data || '').length;
        addEventBlock(type, data, eventId);
        updateStats();
    }

    // ========== 连接管理 ==========
    // 使用 fetch + ReadableStream 替代 EventSource
    // EventSource 只能监听已知事件名（onmessage 无法接收自定义 event: 类型）
    // fetch 方式手动解析 SSE 协议，可捕获所有事件类型
    window.toggleConnection = function() {
        if (abortController) {
            disconnect();
        } else {
            connect();
        }
    };

    async function connect() {
        const url = $('sseUrl').value.trim();
        if (!url) { alert('请输入 SSE 地址'); return; }

        abortController = new AbortController();
        const btn = $('connectBtn');
        btn.textContent = '■ 断开';
        btn.className = 'btn btn-disconnect';
        setStatus('connecting', '连接中...');
        startTime = Date.now();
        durationTimer = setInterval(updateStats, 1000);

        try {
            const response = await fetch(url, {
                signal: abortController.signal,
                headers: { 'Accept': 'text/event-stream' }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }

            const ct = response.headers.get('content-type') || '';
            if (!ct.includes('text/event-stream') && !ct.includes('text/plain')) {
                recordEvent('error', `警告: Content-Type 为 ${ct}，可能不是标准 SSE 流`, null);
            }

            setStatus('connected', '已连接');
            recordEvent('open', `HTTP ${response.status} 连接已建立`, null);

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });
                // 按双换行分割 SSE 事件
                const parts = buffer.split('\n\n');
                // 最后一个可能不完整，保留在 buffer
                buffer = parts.pop() || '';

                for (const part of parts) {
                    if (!part.trim()) continue;
                    const event = parseSSEBlock(part);
                    if (event) {
                        recordEvent(event.type || 'message', event.data, event.id);
                    }
                }
            }

            // 流正常结束
            recordEvent('close', '服务器已关闭连接（流结束）', null);
            setStatus('disconnected', '已断开');
            resetButton();

        } catch (e) {
            if (e.name === 'AbortError') {
                // 用户主动断开，不报错
                recordEvent('close', '用户主动断开连接', null);
            } else {
                setStatus('error', '连接失败');
                recordEvent('error', e.message || String(e), null);
            }
            resetButton();
        } finally {
            abortController = null;
            if (durationTimer) { clearInterval(durationTimer); durationTimer = null; }
        }
    }

    // 解析单个 SSE 事件块
    function parseSSEBlock(block) {
        let eventType = 'message'; // 默认
        let data = '';
        let id = null;
        let hasData = false;

        const lines = block.split('\n');
        for (const line of lines) {
            if (line.startsWith('data:')) {
                hasData = true;
                // data: 后可跟一个空格（SSE 规范），也可能没有
                const val = line.substring(5);
                data += (data ? '\n' : '') + (val.startsWith(' ') ? val.substring(1) : val);
            } else if (line.startsWith('event:')) {
                eventType = line.substring(6).trim();
            } else if (line.startsWith('id:')) {
                id = line.substring(3).trim();
            } else if (line.startsWith('retry:')) {
                // 忽略 retry 指令
            } else if (line.startsWith(':')) {
                // 注释行，忽略
            }
        }

        if (!hasData && !id) return null;
        return { type: eventType, data, id };
    }

    function disconnect() {
        if (abortController) {
            abortController.abort();
            abortController = null;
        }
        setStatus('disconnected', '已断开');
        resetButton();
        if (durationTimer) { clearInterval(durationTimer); durationTimer = null; }
    }

    function resetButton() {
        const btn = $('connectBtn');
        btn.textContent = '▶ 连接';
        btn.className = 'btn btn-connect';
    }

    // ========== 工具栏 ==========
    window.clearStream = function() {
        const area = $('streamArea');
        area.innerHTML = '<div class="empty-stream"><div class="icon">&#128225;</div><div>已清空</div></div>';
        events = [];
        totalBytes = 0;
        $('eventCount').textContent = '0';
        $('dataSize').textContent = '0 B';
        $('rate').textContent = '0/s';
    };

    window.exportEvents = function() {
        if (!events.length) { alert('暂无事件可导出'); return; }
        const json = JSON.stringify(events, null, 2);
        downloadFile('sse-events.json', json, 'application/json');
    };

    window.exportRaw = function() {
        if (!events.length) { alert('暂无事件可导出'); return; }
        const text = events.map(e => {
            let line = `[${e.time}] `;
            if (e.id) line += `id:${e.id} `;
            line += `event:${e.type}\n`;
            if (e.data) line += `data: ${e.data}\n`;
            return line;
        }).join('\n');
        downloadFile('sse-raw.txt', text, 'text/plain');
    };

    window.copyLast = function() {
        if (!events.length) { alert('暂无事件'); return; }
        const last = events[events.length - 1];
        const text = last.data || `[${last.type}]`;
        navigator.clipboard.writeText(text).then(() => {
            // 简单提示
            const btn = document.querySelector('.toolbar .btn:last-child');
            const orig = btn.textContent;
            btn.textContent = '✓ 已复制';
            setTimeout(() => btn.textContent = orig, 1500);
        });
    };

    function downloadFile(name, content, type) {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // 页面关闭时断开连接
    window.addEventListener('beforeunload', function() {
        if (abortController) { abortController.abort(); abortController = null; }
    });
})();
</script>
</body>
</html>
