          ]
        },
        { name:'口语交际', cat:'writing', semester:'下', formula:'自我介绍 · 打电话 · 看图说话 · 请求帮助', desc:'学会自我介绍、打电话、看图说话等基本口语交际能力', example:'# 自我介绍\n大家好！我叫小明，今年7岁了。\n我在一年级一班，我喜欢画画。\n\n# 打电话\n拨打：您好，请问是XX吗？我是XX。\n接听：您好，我是XX。请问有什么事？\n结束：好的，再见！\n\n# 请求帮助\n请问……可以吗？\n能不能帮我……？\n谢谢你！不客气！',
          table:[
            { group:'口语交际要点' },
            { key:'自我介绍', val:'姓名、年龄、爱好' },
            { key:'打电话', val:'先问好、说身份、说事情、礼貌结束' },
            { key:'看图说话', val:'观察→想象→表达' },
            { key:'请求帮助', val:'用"请问""能不能""谢谢"' },
            { key:'道歉', val:'对不起 → 没关系' },
          ]
        },
    ];

    const categories = [
        { id:'all', label:'全部' },
        { id:'pinyin', label:'拼音' },
        { id:'char', label:'识字写字' },
        { id:'word', label:'词语' },
        { id:'sentence', label:'句子标点' },
        { id:'reading', label:'阅读积累' },
        { id:'writing', label:'口语交际' },
    ];
    const catLabelMap = {};
    categories.forEach(c => catLabelMap[c.id] = c.label);
    let activeCat = 'all', searchQuery = '';

    function renderTabs() {
        $('catTabs').innerHTML = categories.map(c => {
            const count = c.id === 'all' ? knowledgePoints.length : knowledgePoints.filter(kp => kp.cat === c.id).length;
            return `<span class="cat-tab ${c.id === activeCat ? 'active' : ''}" onclick="selectCat('${c.id}')">${c.label}<span class="cat-badge">${count}</span></span>`;
        }).join('');
    }
    window.selectCat = function(cat) { activeCat = cat; renderTabs(); filterKps(); };
    window.filterKps = function() {
        searchQuery = $('searchInput').value.trim().toLowerCase();
        const filtered = knowledgePoints.filter(kp => {
            if (activeCat !== 'all' && kp.cat !== activeCat) return false;
            if (!searchQuery) return true;
            return kp.name.toLowerCase().includes(searchQuery) || kp.desc.toLowerCase().includes(searchQuery) || kp.formula.toLowerCase().includes(searchQuery);
        });
        $('searchCount').textContent = `${filtered.length} / ${knowledgePoints.length}`;
        if (filtered.length === 0) { $('kpGrid').innerHTML = '<div class="empty-state"><div style="font-size:2rem;margin-bottom:0.3rem">🔍</div>没有找到匹配的知识点</div>'; return; }
        $('kpGrid').innerHTML = filtered.map(kp => `
            <div class="kp-card" onclick="toggleCard(this)">
                <div class="kp-header">
                    <span class="kp-name">${kp.semester ? `<span class="semester-badge ${kp.semester==='上'?'badge-up':'badge-down'}">${kp.semester}册</span> ` : ''}${hl(escapeHtml(kp.name))}</span>
                    <span class="kp-cat-tag tag-${kp.cat}">${catLabelMap[kp.cat]||kp.cat}</span>
                </div>
                <div class="kp-formula">${hl(escapeHtml(kp.formula))}</div>
                <div class="kp-desc">${hl(escapeHtml(kp.desc))}</div>
                <div class="kp-detail">
                    <div class="kp-example">${fmtEx(kp.example)}</div>
                    ${kp.table ? renderTable(kp.table) : ''}
                </div>
            </div>`).join('');
    };
    window.toggleCard = function(c) { c.classList.toggle('expanded'); };
    function renderTable(t) {
        const rows = t.map(o => o.group
            ? `<tr><td colspan="2" style="background:#fff5f5;font-weight:600;color:#b71c1c;font-size:0.72rem;padding:0.35rem 0.5rem;border-bottom:1px solid #ffcdd2;">▸ ${escapeHtml(o.group)}</td></tr>`
            : `<tr><td class="tbl-key">${escapeHtml(o.key)}</td><td>${escapeHtml(o.val)}</td></tr>`
        ).join('');
        return `<span class="kp-section-label">知识要点</span><table class="kp-table"><tr><th>项目</th><th>内容</th></tr>${rows}</table>`;
    }
    function fmtEx(t) { return t.split('\n').map(l => l.startsWith('#') ? `<span class="comment">${escapeHtml(l)}</span>` : `<span class="highlight">${escapeHtml(l)}</span>`).join('\n'); }
    function hl(t) { if (!searchQuery) return t; return t.replace(new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'gi'), '<mark style="background:#fef08a;padding:0 1px;border-radius:2px">$1</mark>'); }
    function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
    renderTabs(); filterKps();
})();
</script>
</body>
</html>
