<html lang="zh-CN">

        .tag-number { background: #fff3e0; color: #e65100; }

        .tag-shape { background: #e8f5e9; color: #2e7d32; }
        .tag-life { background: #e3f2fd; color: #1565c0; }

            color: #4a627a; margin: 0.4rem 0; padding: 0.3rem 0.5rem;
            background: #fff8f0; border-radius: 0.6rem; line-height: 1.6;
            border-left: 3px solid #ffcc80;
        }
        .kp-desc { font-size: 0.8rem; color: #5b6f82; line-height: 1.5; }

        .kp-detail { display: none; margin-top: 0.6rem; }
        .kp-card.expanded .kp-detail { display: block; }
        .kp-example {
            background: #1e293b; color: #e2e8f0; padding: 0.6rem 0.8rem;
            border-radius: 0.8rem; font-family: 'SF Mono', monospace;
            font-size: 0.8rem; line-height: 1.7; overflow-x: auto;
            white-space: pre;
        }
        .kp-example .highlight { color: #ffb74d; font-weight: 600; }
        .kp-example .comment { color: #64748b; font-style: italic; }
        .kp-example .result { color: #81c784; }

        .kp-table {
            margin-top: 0.5rem; border-collapse: collapse;
            width: 100%; font-size: 0.75rem;
        }
        .kp-table th {
            text-align: left; padding: 0.3rem 0.5rem;
            background: #fff8f0; color: #bf360c;
            font-weight: 600; border-bottom: 1.5px solid #ffe0b2;
        }
        .kp-table td {
            padding: 0.25rem 0.5rem; border-bottom: 1px solid #fff3e0;
            vertical-align: top; line-height: 1.45;
        }
        .kp-table tr:last-child td { border-bottom: none; }
        .kp-table .tbl-key { font-weight: 600; color: #e65100; white-space: nowrap; }

        .kp-section-label {
            display: inline-block; font-size: 0.72rem; font-weight: 600;
            color: #4a627a; margin: 0.5rem 0 0.2rem; padding-bottom: 0.15rem;
            border-bottom: 1px dashed #ffcc80;
        }

        .empty-state { text-align: center; padding: 3rem; color: #94a3b8; grid-column: 1 / -1; }
        footer { text-align: center; font-size: 0.75rem; color: #6c86a3; margin-top: 2rem; }

        @media (max-width: 500px) {
            .kp-grid { grid-template-columns: 1fr; }
            body { padding: 1rem; }
        }
    </style>
</head>

<script>
(function() {

        // ==================== 上册 ====================
        { name:'大数的认识', cat:'number', semester:'上', formula:'个·十·百·千·万·十万·百万·千万·亿 / 每相邻计数单位进率是10', desc:'认识亿以内的数，掌握数位顺序表，会读写、比较、改写和求近似数', example:'# 数位顺序表（从右往左）\n个位→十位→百位→千位→万位→十万位→百万位→千万位→亿位\n\n# 读写\n123456789 读作：一亿二千三百四十五万六千七百八十九\n\n# 改写（整万数）\n1230000 = 123万\n\n# 求近似数（四舍五入）\n123456 ≈ 12万（省略万位后面）\n123456789 ≈ 1亿（省略亿位后面）',
          table:[
            { group:'计数单位' },
            { key:'万级', val:'万、十万、百万、千万' },
            { key:'亿级', val:'亿、十亿、百亿、千亿' },
            { key:'进率', val:'每相邻两个计数单位进率都是10' },
            { group:'改写与近似' },
            { key:'改写整万', val:'去掉末尾4个0，加"万"' },
            { key:'改写整亿', val:'去掉末尾8个0，加"亿"' },
            { key:'四舍五入', val:'看省略部分最高位，≥5进1，<5舍去' },
          ]
        },
        { name:'公顷和平方千米', cat:'life', semester:'上', formula:'1公顷 = 10000平方米 / 1平方千米 = 100公顷 = 1000000平方米', desc:'认识大面积单位，掌握面积单位之间的换算', example:'# 面积单位换算\n1平方千米 = 100公顷 = 1000000平方米\n1公顷 = 10000平方米\n\n# 感受大小\n1公顷 ≈ 1个标准足球场\n1平方千米 ≈ 100个足球场\n\n# 换算\n5平方千米 = 500公顷 = 5000000平方米\n3公顷 = 30000平方米',

            { group:'面积单位关系' },

            { key:'1平方千米(km²)', val:'= 100公顷（边长1km的正方形）' },

          table:[
            { group:'角的关系' },

            { key:'1平角', val:'= 180° = 2直角' },
            { key:'1直角', val:'= 90°' },
            { group:'量角步骤' },
            { key:'对心', val:'量角器中心对准角的顶点' },
            { key:'对边', val:'0刻度线对准角的一条边' },
            { key:'读数', val:'看另一条边对应的刻度' },

        },
        { name:'三位数乘两位数', cat:'calc', semester:'上', formula:'用两位数的个位和十位分别去乘三位数 → 积相加', desc:'掌握三位数乘两位数的笔算方法，理解积的变化规律', example:'# 笔算\n   145\n×   23\n──────\n   435   # 145×3（个位）\n  290    # 145×20（十位，左移一位）\n──────\n  3335   # 435+2900=3335\n\n# 积的变化规律\n一个因数不变，另一个因数乘几，积也乘几\n2×3=6 → 2×30=60（×10）',
          table:[
            { group:'笔算法则' },
            { key:'第一步', val:'用两位数的个位乘三位数' },
            { key:'第二步', val:'用两位数的十位乘三位数，末位与十位对齐' },
            { key:'第三步', val:'把两次乘得的积相加' },
            { group:'积的变化规律' },

            { key:'一个因数÷n', val:'积也÷n' },
            { key:'两个因数都×n', val:'积×n²' },
          ]
        },
        { name:'平行四边形和梯形', cat:'shape', semester:'上', formula:'平行四边形：两组对边分别平行 / 梯形：只有一组对边平行', desc:'认识平行与垂直，掌握平行四边形和梯形的特征', example:'# 平行与垂直\n在同一平面内：\n永不相交 → 互相平行\n相交成直角 → 互相垂直\n\n# 平行四边形\n两组对边分别平行且相等\n对角相等\n容易变形（不稳定性）\n\n# 梯形\n只有一组对边平行（上底和下底）\n不平行的两边叫腰\n两腰相等的叫等腰梯形',
          table:[
            { group:'四边形关系' },
            { key:'平行四边形', val:'两组对边分别平行' },

            { key:'梯形', val:'只有一组对边平行' },

            { key:'点到直线距离', val:'垂线段最短' },
          ]
        },
        { name:'除数是两位数的除法', cat:'calc', semester:'上', formula:'先看被除数前两位 → 不够除看前三位 → 商写对应位置 → 余数 < 除数', desc:'掌握除数是两位数的笔算除法，会用"四舍五入"法试商', example:'# 笔算\n     23\n  ──────\n48)1104\n    96     # 48×2=96\n   ────\n    144    # 110-96=14，落下4\n    144    # 48×3=144\n   ────\n      0    # 整除\n\n# 试商\n48 ≈ 50（四舍五入）\n110 ÷ 50 ≈ 2 → 商2\n144 ÷ 50 ≈ 3 → 商3',
          table:[
            { group:'笔算法则' },
            { key:'试商', val:'把除数看成接近的整十数' },
            { key:'四舍法', val:'个位1-4舍去，商可能偏大要调小' },
            { key:'五入法', val:'个位5-9进一，商可能偏小要调大' },
            { key:'余数', val:'每次余数必须比除数小' },

            { key:'前两位够除', val:'商写在十位' },
            { key:'前两位不够', val:'看前三位，商写在个位' },

            { key:'标题', val:'说明统计内容' },
            { key:'横轴', val:'表示项目' },
            { key:'纵轴', val:'表示数量' },
            { key:'直条', val:'宽度相同，高度与数据成正比' },
            { key:'每格代表', val:'根据数据范围确定' },
          ]
        },
        { name:'优化', cat:'logic', semester:'上', formula:'合理安排 → 节省时间 · 提高效率', desc:'学会合理安排时间，感受运筹思想在生活中的应用', example:'# 沏茶问题\n洗水壶1分 → 烧水8分（同时洗茶杯2分+拿茶叶1分）→ 沏茶1分\n共 1+8+1 = 10分\n\n# 烙饼问题\n每次烙2张，每面3分\n烙3张：A正B正→A反C正→B反C反\n共 3×3 = 9分\n\n# 田忌赛马\n上对中、中对下、下对上 → 2:1胜',

            { key:'合理顺序', val:'先做需要等待的事情' },
            { key:'最佳方案', val:'比较多种方案选最优' },

        // ==================== 下册 ====================
        { name:'四则运算', cat:'calc', semester:'下', formula:'先乘除后加减 · 有括号先算括号 · 0的特殊运算', desc:'掌握四则混合运算的顺序，理解0在运算中的特殊性', example:'# 运算顺序\n无括号：先乘除后加减\n3 + 4×5 = 3 + 20 = 23\n\n有括号：先算括号内\n(3+4)×5 = 7×5 = 35\n\n# 0的运算\na+0 = a    a-0 = a\na×0 = 0    0÷a = 0(a≠0)\na-a = 0    a÷a = 1(a≠0)\n0不能做除数！',
          table:[
            { group:'运算顺序' },
            { key:'同级运算', val:'从左往右依次计算' },
            { key:'不同级', val:'先乘除后加减' },
            { key:'有括号', val:'先算小括号，再算中括号' },
            { group:'0的特殊性' },

            { key:'0乘任何数', val:'等于0' },
            { key:'0除以任何数', val:'等于0（0不能做除数）' },

        },
        { name:'观察物体（二）', cat:'shape', semester:'下', formula:'从不同方向观察 → 看到的形状可能不同', desc:'从前面、左面、上面观察由几个正方体搭成的立体图形', example:'# 观察方法\n从前面看 → 看列数和层数\n从左面看 → 看行数和层数\n从上面看 → 看列数和行数\n\n# 摆一摆\n用3个正方体摆出从前面看是■■■的形状\n→ 横着摆一排',
          table:[
            { group:'观察要点' },
            { key:'前面', val:'看正面的形状' },
            { key:'左面', val:'看左侧面的形状' },
            { key:'上面', val:'看俯视图的形状' },
            { key:'同一形状', val:'可能有不同摆法' },

            { key:'结合律', val:'(a+b)+c = a+(b+c)' },

        },

          table:[
            { group:'计数单位' },
            { key:'十分位', val:'0.1（十分之一）' },
            { key:'百分位', val:'0.01（百分之一）' },
            { key:'千分位', val:'0.001（千分之一）' },
            { group:'小数点移动' },
            { key:'向右移1位', val:'扩大到原来的10倍' },
            { key:'向左移1位', val:'缩小到原来的1/10' },
            { group:'单位换算' },
            { key:'名数→单名数', val:'高级单位×进率=低级单位' },
            { key:'低级→高级', val:'低级单位÷进率=高级单位' },
          ]
        },
        { name:'三角形', cat:'shape', semester:'下', formula:'内角和 = 180° · 两边之和 > 第三边', desc:'认识三角形的特征和分类，掌握三角形三边关系和内角和', example:'# 三边关系\n3cm, 4cm, 5cm → 3+4>5 ✓ 能组成三角形\n2cm, 3cm, 6cm → 2+3<6 ✗ 不能组成\n\n# 内角和\n∠A+∠B+∠C = 180°\n已知∠A=60°, ∠B=70°\n∠C = 180-60-70 = 50°\n\n# 分类\n按角：锐角/直角/钝角三角形\n按边：等腰/等边/不等边三角形',
          table:[
            { group:'三角形特征' },
            { key:'三条边', val:'任意两边之和大于第三边' },
            { key:'三个角', val:'内角和 = 180°' },
            { key:'稳定性', val:'三角形具有稳定性' },
            { group:'分类' },
            { key:'锐角三角形', val:'三个角都是锐角' },
            { key:'直角三角形', val:'有一个直角' },
            { key:'钝角三角形', val:'有一个钝角' },
            { key:'等腰三角形', val:'两条边相等，两底角相等' },
            { key:'等边三角形', val:'三条边相等，三个角都是60°' },
          ]
        },
        { name:'小数的加法和减法', cat:'calc', semester:'下', formula:'小数点对齐 → 按整数加减 → 点上小数点', desc:'掌握小数加减法的计算方法，会进行小数加减混合运算', example:'# 小数加法\n  12.35\n+  3.78\n───────\n  16.13   # 小数点对齐，从低位算起\n\n# 小数减法\n  15.2\n-  8.35\n───────\n   6.85   # 补0对齐：15.20-8.35\n\n# 简便计算\n5.6+2.7+4.4 = 5.6+4.4+2.7 = 10+2.7 = 12.7',
          table:[
            { group:'计算方法' },
            { key:'对齐', val:'小数点对齐（相同数位对齐）' },
            { key:'补0', val:'位数不够时在末尾补0' },
            { key:'计算', val:'按整数加减法计算' },
            { key:'点小数点', val:'在得数中对齐横线上的小数点' },
            { group:'运算律', val:'整数运算律同样适用于小数' },
          ]
        },
        { name:'图形的运动（二）', cat:'shape', semester:'下', formula:'轴对称：沿对称轴对折完全重合 / 平移：方向+距离', desc:'认识轴对称图形，会在方格纸上画对称图形和平移图形', example:'# 画对称图形\n1. 找关键点\n2. 量出点到对称轴的距离\n3. 在对称轴另一侧找对应点\n4. 连线\n\n# 平移\n向右平移5格：每个点都向右移5格\n方向不变，形状大小不变',
          table:[
            { group:'轴对称' },
            { key:'对称轴', val:'对折后重合的折痕' },
            { key:'对应点', val:'到对称轴的距离相等' },
            { group:'平移' },
            { key:'方向', val:'上下左右' },
            { key:'距离', val:'平移的格数' },
            { key:'特征', val:'形状、大小、方向都不变' },
          ]
        },
        { name:'平均数与条形统计图', cat:'life', semester:'下', formula:'平均数 = 总数 ÷ 份数', desc:'理解平均数的意义，会求平均数，认识复式条形统计图', example:'# 求平均数\n5次成绩：85, 90, 88, 92, 85\n平均 = (85+90+88+92+85) ÷ 5\n     = 440 ÷ 5\n     = 88\n\n# 移多补少\n把多的补给少的，使每份同样多\n\n# 复式条形统计图\n两组数据对比，用不同颜色/花纹的直条',
          table:[
            { group:'平均数' },
            { key:'公式', val:'平均数 = 总数 ÷ 份数' },
            { key:'特征', val:'反映一组数据的整体水平' },
            { key:'范围', val:'平均数在最小值和最大值之间' },
            { group:'复式统计图' },
            { key:'图例', val:'说明不同直条代表的含义' },
            { key:'对比', val:'便于比较两组数据' },
          ]
        },
        { name:'鸡兔同笼', cat:'logic', semester:'下', formula:'假设法：假设全是鸡/兔 → 算出腿数差 → 求另一种', desc:'掌握用假设法和列表法解决鸡兔同笼问题', example:'# 鸡兔同笼\n笼中有鸡和兔共8只，腿共22条\n\n# 假设法\n假设全是鸡：8×2 = 16条\n少：22-16 = 6条\n每只兔比鸡多2条腿\n兔：6÷2 = 3只\n鸡：8-3 = 5只\n\n# 验算\n5×2+3×4 = 10+12 = 22 ✓',
          table:[
            { group:'假设法步骤' },
            { key:'假设', val:'假设全是其中一种动物' },
            { key:'算差', val:'算出腿数与实际的差' },
            { key:'除2', val:'差 ÷ 2 = 另一种动物数量' },
            { key:'求另一种', val:'总数 - 已求数量 = 另一数量' },
            { group:'公式法' },
            { key:'兔数', val:'(总腿数 - 头数×2) ÷ 2' },
            { key:'鸡数', val:'(头数×4 - 总腿数) ÷ 2' },
          ]
        },
    ];

    const categories = [
        { id:'all', label:'全部' },
        { id:'number', label:'数的认识' },
        { id:'calc', label:'计算' },
        { id:'shape', label:'图形' },
        { id:'life', label:'生活应用' },
        { id:'method', label:'计算方法' },
        { id:'logic', label:'数学广角' },
    ];

    const catLabelMap = {};
    categories.forEach(c => catLabelMap[c.id] = c.label);

    let activeCat = 'all';
    let searchQuery = '';

    function renderTabs() {
        $('catTabs').innerHTML = categories.map(c => {
            const count = c.id === 'all' ? knowledgePoints.length : knowledgePoints.filter(kp => kp.cat === c.id).length;
            return `<span class="cat-tab ${c.id === activeCat ? 'active' : ''}" onclick="selectCat('${c.id}')">${c.label}<span class="cat-badge">${count}</span></span>`;
        }).join('');
    }

    window.selectCat = function(cat) {
        activeCat = cat;
        renderTabs();
        filterKps();
    };

    window.filterKps = function() {
        searchQuery = $('searchInput').value.trim().toLowerCase();
        const filtered = knowledgePoints.filter(kp => {
            const matchCat = activeCat === 'all' || kp.cat === activeCat;
            if (!matchCat) return false;
            if (!searchQuery) return true;
            return kp.name.toLowerCase().includes(searchQuery) ||
                   kp.desc.toLowerCase().includes(searchQuery) ||
                   kp.formula.toLowerCase().includes(searchQuery) ||
                   (kp.semester && kp.semester.includes(searchQuery));
        });

        $('searchCount').textContent = `${filtered.length} / ${knowledgePoints.length}`;

        if (filtered.length === 0) {
            $('kpGrid').innerHTML = '<div class="empty-state"><div style="font-size:2rem;margin-bottom:0.3rem">🔍</div>没有找到匹配的知识点</div>';
            return;
        }

        $('kpGrid').innerHTML = filtered.map(kp => `
            <div class="kp-card" onclick="toggleCard(this)">
                <div class="kp-header">
                    <span class="kp-name">${kp.semester ? `<span class="semester-badge ${kp.semester==='上'?'badge-up':'badge-down'}">${kp.semester}册</span> ` : ''}${highlightSearch(escapeHtml(kp.name))}</span>
                    <span class="kp-cat-tag tag-${kp.cat}">${catLabelMap[kp.cat] || kp.cat}</span>
                </div>
                <div class="kp-formula">${highlightSearch(escapeHtml(kp.formula))}</div>
                <div class="kp-desc">${highlightSearch(escapeHtml(kp.desc))}</div>
                <div class="kp-detail">
                    <div class="kp-example">${formatExample(kp.example)}</div>
                    ${kp.table ? renderTable(kp.table) : ''}
                </div>
            </div>
        `).join('');
    };

    window.toggleCard = function(card) { card.classList.toggle('expanded'); };

    function renderTable(table) {
        const rows = table.map(o => {
            if (o.group) {
                return `<tr><td colspan="2" style="background:#fff8f0;font-weight:600;color:#bf360c;font-size:0.72rem;padding:0.35rem 0.5rem;border-bottom:1px solid #ffe0b2;">▸ ${escapeHtml(o.group)}</td></tr>`;
            }
            return `<tr><td class="tbl-key">${escapeHtml(o.key)}</td><td>${escapeHtml(o.val)}</td></tr>`;
        }).join('');
        return `<span class="kp-section-label">知识要点</span><table class="kp-table"><tr><th>项目</th><th>内容</th></tr>${rows}</table>`;
    }

    function formatExample(text) {
        return text.split('\n').map(line => {
            if (line.startsWith('#')) return `<span class="comment">${escapeHtml(line)}</span>`;
            return `<span class="highlight">${escapeHtml(line)}</span>`;
        }).join('\n');
    }

    function highlightSearch(text) {
        if (!searchQuery) return text;
        const regex = new RegExp(`(${searchQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
        return text.replace(regex, '<mark style="background:#fef08a;padding:0 1px;border-radius:2px">$1</mark>');
    }

    function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    renderTabs();
    filterKps();
})();
</script>
</body>
</html>
