    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(160deg, #f4f7fb 0%, #eaf0f6 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem 3rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }

        /* 头部 */
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 {
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(135deg, #1e2b3c, #2c5a6e);
            background-clip: text; -webkit-background-clip: text; color: transparent;
        }
        .header p { color: #6c86a3; margin-top: 0.3rem; font-size: 0.95rem; }

        /* 搜索栏 */
        .search-bar {
            max-width: 480px; margin: 0 auto 1.5rem; position: relative;
        }
        .search-input {
            width: 100%; padding: 0.7rem 1rem 0.7rem 2.8rem;
            border: 1.5px solid #dce5ec; border-radius: 3rem;
            font-size: 0.92rem; background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px); transition: 0.2s; color: #1f3b4c;
        }
        .search-input:focus { outline: none; border-color: #2c7da0; box-shadow: 0 0 0 3px rgba(44,125,160,0.1); background: white; }
        .search-input::placeholder { color: #b0bec5; }
        .search-icon {
            position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
            font-size: 1rem; color: #94a3b8; pointer-events: none;
        }
        .search-clear {
            position: absolute; right: 0.8rem; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 1rem; color: #94a3b8;
            cursor: pointer; display: none; padding: 0.2rem;
        }
        .search-clear:hover { color: #4a627a; }

        /* 分类标签 */
        .category-tabs {
            display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center;
            margin-bottom: 1.8rem;
        }
        .cat-tab {
            padding: 0.4rem 1rem; border-radius: 2rem;
            font-size: 0.82rem; font-weight: 500; cursor: pointer;
            background: rgba(255,255,255,0.6); color: #4a627a;
            border: 1.5px solid transparent; transition: 0.2s;
            backdrop-filter: blur(2px);
        }
        .cat-tab:hover { background: rgba(255,255,255,0.9); }
        .cat-tab.active {
            background: white; color: #2c7da0; font-weight: 600;
            border-color: #b8d8e8; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .cat-count {
            font-size: 0.7rem; background: #eef3f8; color: #6c86a3;
            padding: 0.05rem 0.35rem; border-radius: 1rem; margin-left: 0.3rem;
            font-weight: 600;
        }
        .cat-tab.active .cat-count { background: #e0f2fe; color: #2c7da0; }

        /* 卡片网格 */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        /* 卡片 */
        .tool-card {
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(2px);
            border-radius: 1.2rem;
            padding: 1.2rem 1.1rem;
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.07);
            transition: all 0.2s ease;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.5);
            text-decoration: none; display: block; color: inherit;
        }
        .tool-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 28px -8px rgba(0,0,0,0.14);
            background: white; border-color: #d0e4ef;
        }
        .card-top { display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.6rem; }
        .card-icon { font-size: 1.6rem; flex-shrink: 0; }
        .card-title {
            font-size: 1rem; font-weight: 600; color: #1f3b4c;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .card-desc {
            color: #6c86a3; font-size: 0.78rem; line-height: 1.45;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-tag {
            display: inline-block; font-size: 0.62rem; padding: 0.1rem 0.4rem;
            border-radius: 0.8rem; margin-top: 0.5rem; font-weight: 500;
        }
        .tag-dev { background: #ede9fe; color: #6d28d9; }
        .tag-encode { background: #e0f2fe; color: #0369a1; }
        .tag-security { background: #fce7f3; color: #be185d; }
        .tag-util { background: #dcfce7; color: #166534; }
        .tag-cheatsheet { background: #fef3c7; color: #92400e; }
        .tag-bookmark { background: #e0f2fe; color: #0369a1; }
        .tag-textbook { background: #fff3e0; color: #e65100; }

        /* 空状态 */
        .empty-state {
            text-align: center; padding: 3rem 1rem; color: #94a3b8;
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

        /* 收藏按钮 */
        .tool-card { position: relative; }
        .fav-btn {
            position: absolute; top: 0.6rem; right: 0.6rem;
            width: 28px; height: 28px; border: none; background: rgba(255,255,255,0.7);
            border-radius: 50%; cursor: pointer; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; z-index: 2; color: #c0c8d0; backdrop-filter: blur(2px);
        }
        .fav-btn:hover { background: #fff3cd; color: #f59e0b; transform: scale(1.15); }
        .fav-btn.active { color: #f59e0b; background: #fef3c7; }
        .fav-btn.active:hover { background: #fde68a; }

        /* 底部 */
        .footer {
            margin-top: 3rem; text-align: center; font-size: 0.78rem;
            color: #94a3b8; padding-top: 1.5rem; border-top: 1px solid #dce5ec;
        }

        /* 公众号推广 */
        .promo-banner {
            margin-top: 2rem;
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 40%, #f0f9ff 100%);
            border: 1px solid #bbf7d0;
            border-radius: 1.2rem;
            padding: 1.4rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 1.4rem;
            transition: 0.25s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .promo-banner::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%; width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(34,197,94,0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }
        .promo-banner:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px -6px rgba(34,197,94,0.12);
            border-color: #86efac;
        }
        .promo-qr {
            width: 80px; height: 80px; border-radius: 0.8rem;
            object-fit: cover; flex-shrink: 0;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .promo-info { flex: 1; min-width: 0; }
        .promo-title {
            font-size: 0.95rem; font-weight: 600; color: #166534;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .promo-title .badge {
            font-size: 0.6rem; background: #dcfce7; color: #16a34a;
            padding: 0.1rem 0.45rem; border-radius: 1rem; font-weight: 500;
        }
        .promo-desc {
            font-size: 0.78rem;
            margin-top: 0.25rem; line-height: 1.5;
            color: #15803d;
        }
        .promo-hint {
            font-size: 0.7rem; color: #303f35; margin-top: 0.4rem;
        }
        .promo-arrow {
            color: #86efac; flex-shrink: 0; transition: 0.3s;
        }
        .promo-banner:hover .promo-arrow { color: #22c55e; transform: translateX(3px); }

        @media (max-width: 640px) {
            body { padding: 1.5rem 0.8rem 2rem; }
            .header h1 { font-size: 1.8rem; }
            .cards-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.7rem; }
            .tool-card { padding: 1rem 0.8rem; border-radius: 1rem; }
            .card-icon { font-size: 1.4rem; }
            .card-title { font-size: 0.9rem; }
            .promo-banner { padding: 1rem 1.2rem; gap: 1rem; }
            .promo-qr { width: 60px; height: 60px; }
            .promo-title { font-size: 0.85rem; }
        }
    </style>

        // { name:'语文二年级知识点', icon:'📖', desc:'查字典 · 量词 · 多音字 · 看图写话 · 必背古诗', href:'utils/chinese-grade2.html', cat:'textbook', tags:'语文 二年级 人教版 查字典 量词 多音字 近义词 反义词 写话' },
        // { name:'语文三年级知识点', icon:'📖', desc:'修辞手法 · 句式转换 · 段落结构 · 习作入门 · 必背古诗', href:'utils/chinese-grade3.html', cat:'textbook', tags:'语文 三年级 人教版 修辞 比喻 拟人 句式转换 段落 习作 古诗' },
        // { name:'语文四年级知识点', icon:'📖', desc:'缩句扩句 · 阅读理解 · 书信格式 · 记叙文 · 必背古诗', href:'utils/chinese-grade4.html', cat:'textbook', tags:'语文 四年级 人教版 缩句 扩句 阅读理解 书信 记叙文 古诗' },
        // { name:'语文五年级知识点', icon:'📖', desc:'说明方法 · 人物描写 · 读后感 · 研究报告 · 必背古诗', href:'utils/chinese-grade5.html', cat:'textbook', tags:'语文 五年级 人教版 说明文 人物描写 读后感 研究报告 古诗' },
        // { name:'语文六年级知识点', icon:'📖', desc:'文言文 · 表达技巧 · 演讲稿 · 古诗词鉴赏 · 议论文', href:'utils/chinese-grade6.html', cat:'textbook', tags:'语文 六年级 人教版 文言文 表达技巧 演讲 古诗词鉴赏 议论文' },
    ];

    const FAV_KEY = 'it-tools-favorites';
    let favorites = [];
    try { favorites = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch(e) { favorites = []; }
    function saveFavorites() { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); }
    function isFav(href) { return favorites.includes(href); }

    const categories = [
        { id:'all', label:'全部', icon:'' },
        { id:'fav', label:'我的收藏', icon:'⭐' },
        { id:'dev', label:'开发工具', icon:'💻' },
        { id:'cheatsheet', label:'命令速查', icon:'📖' },
        { id:'bookmark', label:'网站收藏', icon:'🌐' },
        { id:'textbook', label:'人教版知识点', icon:'📖' },
        { id:'encode', label:'编码转换', icon:'🔄' },
        { id:'security', label:'加密安全', icon:'🛡️' },
        { id:'util', label:'实用工具', icon:'🧰' },
    ];

    const tagClassMap = { dev:'tag-dev', cheatsheet:'tag-cheatsheet', encode:'tag-encode', security:'tag-security', util:'tag-util', bookmark:'tag-bookmark', textbook:'tag-textbook' };
    const catLabelMap = {};
    categories.forEach(c => catLabelMap[c.id] = c.label);

    let activeCat = 'all';
    let searchQuery = '';

    // Render tabs
    const tabsEl = document.getElementById('categoryTabs');
    function renderTabs() {
        tabsEl.innerHTML = categories.map(c => {
            let count;
            if (c.id === 'all') count = tools.length;
            else if (c.id === 'fav') count = favorites.length;
            else count = tools.filter(t => t.cat === c.id).length;
            return `<span class="cat-tab ${c.id === activeCat ? 'active' : ''}" data-cat="${c.id}" onclick="selectCat('${c.id}')">${c.icon} ${c.label}<span class="cat-count">${count}</span></span>`;
        }).join('');
    }

    // Render cards
    const gridEl = document.getElementById('cardsGrid');
    function renderCards() {
        let filtered = tools.filter(t => {
            if (activeCat === 'fav') { if (!isFav(t.href)) return false; }
            else if (activeCat !== 'all' && t.cat !== activeCat) return false;
            if (!searchQuery) return true;
            const q = searchQuery.toLowerCase();
            return t.name.toLowerCase().includes(q) || t.desc.toLowerCase().includes(q) || t.tags.toLowerCase().includes(q);
        });

        // 收藏排序：收藏的排在前面
        if (activeCat === 'all' && !searchQuery) {
            filtered.sort((a, b) => (isFav(b.href) ? 1 : 0) - (isFav(a.href) ? 1 : 0));
        }

        if (filtered.length === 0) {
            const emptyMsg = activeCat === 'fav'
                ? '<div class="empty-state"><div class="icon">⭐</div><div>暂无收藏工具</div><div style="font-size:0.8rem;margin-top:0.3rem;">点击工具卡片右上角的 ☆ 即可收藏</div></div>'
                : '<div class="empty-state"><div class="icon">🔍</div><div>没有找到匹配的工具</div></div>';
            gridEl.innerHTML = emptyMsg;
            return;
        }

        gridEl.innerHTML = filtered.map(t => `
            <a href="${t.href}" class="tool-card">
                <button class="fav-btn ${isFav(t.href) ? 'active' : ''}" onclick="toggleFav(event,'${t.href}')" title="${isFav(t.href) ? '取消收藏' : '收藏此工具'}">${isFav(t.href) ? '★' : '☆'}</button>
                <div class="card-top">
                    <span class="card-icon">${t.icon}</span>
                    <span class="card-title">${t.name}</span>
                </div>
                <div class="card-desc">${t.desc}</div>
                <span class="card-tag ${tagClassMap[t.cat]}">${catLabelMap[t.cat]}</span>
            </a>
        `).join('');
    }

    window.selectCat = function(cat) {
        activeCat = cat;
        renderTabs();
        renderCards();
    };

    window.onSearch = function() {
        searchQuery = document.getElementById('searchInput').value.trim();
        document.getElementById('searchClear').style.display = searchQuery ? 'block' : 'none';
        renderCards();
    };

    window.clearSearch = function() {
        document.getElementById('searchInput').value = '';
        searchQuery = '';
        document.getElementById('searchClear').style.display = 'none';
        renderCards();
    };

    window.toggleFav = function(e, href) {
        e.preventDefault();
        e.stopPropagation();
        const idx = favorites.indexOf(href);
        if (idx >= 0) favorites.splice(idx, 1);
        else favorites.push(href);
        saveFavorites();
        renderTabs();
        renderCards();
    };

    renderTabs();
    renderCards();
})();
</script>
